spring.application.name=repositorio_universitario
spring.datasource.url=jdbc:mysql://${MY_SQL_HOST:localhost}:3306/repositorio_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${MY_SQL_USERNAME}
spring.datasource.password=${MY_SQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#spring.datasource.url=jdbc:h2:mem:testdb
#spring.datasource.driverClassName=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=
#spring.h2.console.enable=true
#spring.h2.console.path=/h2-console

server.port=8080
server.servlet.session.persistent=false


spring.security.oauth2.client.registration.google.client-id=${CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email

aws.accessKey=${AWS_ACCESS_KEY_ID}
aws.secretKey=${AWS_SECRET_ACCESS_KEY}
aws.region=${AWS_REGION}
aws.s3.bucket=repositorio-universitario-024253330536-us-east-2-an


spring.devtools.livereload.enabled=false
spring.devtools.restart.enabled=false

spring.jpa.hibernate.ddl-auto=update
#spring.sql.init.mode=always
#spring.jpa.defer-datasource-initialization=true

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB