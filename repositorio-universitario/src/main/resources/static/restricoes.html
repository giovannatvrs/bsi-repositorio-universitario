<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restrições - Repositório Universitário - BSI UNIRIO</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>
<body>

<header>
  <div class="logo">
    <img src="../fotos/cropped-bsi-logomarcaV01.png" alt="Logotipo do curso de BSI da UNIRIO" id="imagem-logo">
    <h1>
      <a href="usuario.html">
        <span class="linha1">REPOSITÓRIO</span>
        <span class="linha2">UNIVERSITÁRIO</span>
      </a>
    </h1>
  </div>
  <div class="informacoes-perfil">
    <img id="foto-perfil" alt="Foto de perfil">
    <span  id="nome-usuario"></span>
  </div>

</header>
<div id="container">
  <aside>
    <div id="paginas">

    </div>

  </aside>
  <section id="main">
    <h2>Usuários</h2>
    <table id="tabela">
      <thead>
      <tr>
        <th>Nome</th>
        <th>E-mail</th>
        <th></th>
      </tr>
      </thead>
      <tbody id="lista-usuarios-restricao">

      </tbody>
    </table>
    <div id="paginacao-restricao" class="paginacao">

    </div>
  </section>
</div>
<script>
  async function listarUsuariosComuns(pagina){
    paginaAtual = pagina;
    try{
      const response = await fetch(`/usuarios-comuns?page=${pagina}`, {
        method: 'GET',
        credentials: "include"
      });
      if(!response.ok){
        throw new Error(`Erro HTTP: ${response.status}`);
      }
      const data = await response.json();
      let info = '';
      data.content.forEach(function (usuario){
        info += `<tr><td class="informacoes-perfil"><img src="${usuario.url_foto}">${usuario.nome}</td>
            <td>${usuario.email}</td>
            <td> ${usuario.suspenso === false ? `<button data-id="${usuario.id}" class="botao-suspender-usuario">Suspender usuário</button>` :
                `<button class="retirar-suspensao" data-id="${usuario.id}">Retirar suspensão</button>`}</td></tr>`
      })
      document.getElementById("lista-usuarios-restricao").innerHTML = info;
      retirarSuspensao();
      suspenderUsuario();
      let botoesPagina = '';
      for(let i = 0; i < data.totalPages; i++){
        botoesPagina += `<button onclick="listarUsuariosComuns(${i})" class="${i === paginaAtual ? 'ativa' : ''}">${i+1}</button>`
      }
      document.getElementById("paginacao-restricao").innerHTML = botoesPagina;
    }catch(error){
      console.error("Falha em carregar dados dos usuários", error);
    }
  }

  document.addEventListener("DOMContentLoaded", listarUsuariosComuns(0));
</script>
<script src="js/script.js"></script>
</body>
</html>
