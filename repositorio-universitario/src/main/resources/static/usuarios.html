<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários - Repositório Universitário - BSI UNIRIO</title>
    <link rel="stylesheet" href="/css/style.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>
<body>

<header>
    <div class="logo">
        <img src="../fotos/cropped-bsi-logomarcaV01.png" alt="Logotipo do curso de BSI da UNIRIO" id="imagem-logo">
        <h1>
            <a href="usuario.html">
                <span class="linha1">REPOSITÓRIO</span>
                <span class="linha2">UNIVERSITÁRIO</span>
            </a>
        </h1>
    </div>
    <div class="informacoes-perfil">
        <img id="foto-perfil" alt="Foto de perfil">
        <span  id="nome-usuario"></span>
    </div>

</header>
<div id="container">
    <aside>
        <div id="paginas">
            <a onclick="history.back()">Voltar</a>
            <a>Histórico</a>
            <a href="/moderadores.html">Moderadores</a>
        </div>

    </aside>
    <section id="main">
        <h2>Todos os Usuários</h2>
        <table id="tabela">
            <thead>
            <tr>
                <th>Nome</th>
                <th>E-mail</th>
                <th>Papel</th>
                <th>Ação</th>
            </tr>
            </thead>
            <tbody id="lista-usuarios">

            </tbody>
        </table>
        <div id="paginacao-usuarios" class="paginacao">

        </div>
    </section>
</div>
<script>
    async function listarUsuarios(pagina){
        paginaAtual = pagina;
        try{
            const response = await fetch(`/usuarios?page=${pagina}`,{
                credentials: "include"
            });
            if(!response.ok){
                throw new Error(`Erro HTTP: ${response.status}`);
            }
            let data = await response.json();
            let info = '';
            console.log(data);
            data.content.forEach(function(usuario){
                let papel = '';
                switch(usuario.funcao){
                    case "ADMINISTRADOR":
                        papel = 'Administrador(a)';
                        break;
                    case "MODERADOR":
                        papel = 'Moderador(a)';
                        break;
                    case "USUARIO":
                        papel = 'Usuário(a)';
                        break;
                }

                info +=`<tr><td><div class="informacoes-perfil"><img src="${usuario.url_foto}">${usuario.nome}</div></td>
            <td>${usuario.email}</td><td>${papel}</td>

            <td class="alterar-usuario"> ${papel === "Usuário(a)" ? `<button class="botao-tornar-usuario-moderador" data-id="${usuario.id}">Tornar usuário moderador</button>` : ``}</td></tr>`

            })
            document.getElementById("lista-usuarios").innerHTML=info;
            ativarPromocaoUsuarios();
            let botoesPagina = '';
            for(let i = 0; i < data.totalPages; i++){
                botoesPagina += `<button onclick="listarUsuarios(${i})" class="${i === paginaAtual ? 'ativa' : ''}">${i+1}</button>`;
            }
            document.getElementById("paginacao-usuarios").innerHTML = botoesPagina;
        }
        catch (error){
            console.error("Falha em carregar os dados dos usuários",error);
        }



    }
    document.addEventListener("DOMContentLoaded", listarUsuarios(0));
</script>
<script src="js/script.js"></script>
</body>
</html>
