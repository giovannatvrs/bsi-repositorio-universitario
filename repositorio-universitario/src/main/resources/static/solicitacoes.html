<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Repositório Universitário - BSI UNIRIO</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>
<body>

<header>
  <div class="logo">
    <img src="../fotos/cropped-bsi-logomarcaV01.png" alt="Logotipo do curso de BSI da UNIRIO" id="imagem-logo">
    <h1>
      <a href="usuario.html">
        <span class="linha1">REPOSITÓRIO</span>
        <span class="linha2">UNIVERSITÁRIO</span>
      </a>
    </h1>
  </div>
  <div class="informacoes-perfil">
    <img id="foto-perfil" alt="Foto de perfil">
    <span  id="nome-usuario"></span>
  </div>

</header>
<div id="container">
  <aside>
    <div id="paginas">
      <a onclick="history.back()">Voltar</a>
      <a href="envios.html">Envios</a>
      <a href="restricoes.html">Restrições</a>
    </div>

  </aside>
  <section id="main">
    <h2>Arquivos Pendentes</h2>
    <table id="tabela">
      <thead>
      <tr>
        <th>Nome</th>
        <th>Disciplina</th>
        <th>Data</th>
        <th></th>
        <th></th>
        <th></th>
      </tr>
      </thead>
      <tbody id="lista-arquivos-pendentes">

      </tbody>
    </table>
    <div id="paginacao-solicitacoes" class="paginacao">

    </div>
  </section>
</div>
<script>
  async function listarArquivosPendentes(pagina){
    paginaAtual = pagina;
    try{
      const response = await fetch(`/solicitacoes?page=${pagina}`,{
        credentials: "include"
      });
      if(!response.ok){
        throw new Error(`Erro HTTP: ${response.status}`);
      }
      const data = await response.json();
      let info = '';
      data.content.forEach(function (arquivo){
        info +=`<tr><td>${arquivo.nome}</td><td>${arquivo.disciplina}</td><td>${arquivo.data}</td>
                        <td><span class="material-symbols-outlined botao-visualizar" data-id="${arquivo.id}">description</span></td>
                        <td><button class="aprovar-arquivo" data-id="${arquivo.id}">Aprovar</button></td>
                        <td><button class="reprovar-arquivo" data-id="${arquivo.id}">Reprovar</button></td>
                        </tr>`
      })
      document.getElementById("lista-arquivos-pendentes").innerHTML = info;
      visualizarArquivo();
      aprovarArquivo();
      reprovarArquivo();
      let botoesPagina = '';
      for(let i = 0; i < data.totalPages; i++){
        botoesPagina += `<button onclick="listarArquivosPendentes(${i})" class="${i === paginaAtual ? 'ativa': ''}">${i+1}</button>`
      }
      document.getElementById("paginacao-solicitacoes").innerHTML = botoesPagina;
    }catch (error){
      console.error("Falha em carregar arquivos", error);
    }
  }

  document.addEventListener("DOMContentLoaded",  listarArquivosPendentes(0));
</script>
<script src="js/script.js"></script>
</body>
</html>
