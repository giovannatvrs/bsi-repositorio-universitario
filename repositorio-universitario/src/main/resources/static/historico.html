<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico - Repositório Universitário - BSI UNIRIO</title>
    <link rel="stylesheet" href="css/style.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>
<body>

<header>
    <div class="logo">
        <img src="../fotos/cropped-bsi-logomarcaV01.png" alt="Logotipo do curso de BSI da UNIRIO" id="imagem-logo">
        <h1>
            <a href="home.html">
                <span class="linha1">REPOSITÓRIO</span>
                <span class="linha2">UNIVERSITÁRIO</span>
            </a>
        </h1>
    </div>
    <div class="menu-perfil">
        <div class="informacoes-perfil">
            <img src="" id="foto-perfil" referrerpolicy="no-referrer" alt="Foto de perfil do usuário">
            <span id="nome-usuario"></span>
            <span class="material-symbols-outlined" id="seta-mais-opcoes">keyboard_arrow_down</span>
        </div>
        <div class="opcoes">
            <a class="logout" href="/logout">
                <span class="material-symbols-outlined">logout</span>
                <span>Sair</span>
            </a>
        </div>
    </div>
</header>
<div class="notificacao">
</div>

<div id="container">
    <aside>
        <div id="paginas">
            <!-- Os links da navegação serão renderizados dinamicamente pelo script.js -->
        </div>
    </aside>
    <section id="main">
        <h2>Histórico</h2>
        <table id="tabela">
            <thead>
            <tr>
                <th>Responsável</th>
                <th>Ação</th>
                <th>Item</th>
                <th>Data</th>
            </tr>
            </thead>
            <tbody id="lista-historico">

            </tbody>
        </table>
        <div id="paginacao-historico" class="paginacao">

        </div>
    </section>
</div>

<!-- Scripts globais e da pagina -->
<script src="js/script.js"></script>
<script>
    paginaAtual = 0;

    document.addEventListener("DOMContentLoaded", () => {
        if (typeof fetchData === "function") {
            fetchData();
        }
        listarHistorico(0);
    });

    async function listarHistorico(pagina) {
        paginaAtual = pagina;
        const lista = document.getElementById("lista-historico");
        const containerPaginacao = document.getElementById("paginacao-historico");

        try {
            const response = await fetch(`/api/historico?page=${pagina}`, {
                method: "GET",
                credentials: "include"
            });

            if (!response.ok) {
                throw new Error(`Erro HTTP: ${response.status}`);
            }

            const data = await response.json();

            // Mensagem amigável caso não haja atividades no histórico
            if (!data.content || data.content.length === 0) {
                lista.innerHTML = `
                    <tr>
                        <td colspan="4" style="text-align: center; padding: 20px; color: #666;">
                            Nenhuma atividade encontrada no momento.
                        </td>
                    </tr>
                `;
                if (containerPaginacao) containerPaginacao.innerHTML = '';
                return;
            }

            // Renderização dos registros
            lista.innerHTML = data.content.map(historico => {
                const dataFormatada = historico.data
                    ? new Date(historico.data).toLocaleString("pt-BR")
                    : "-";

                return `
                    <tr>
                        <td>${historico.responsavel ?? "-"}</td>
                        <td>${historico.acao ?? "-"}</td>
                        <td>${historico.item ?? "-"}</td>
                        <td>${dataFormatada}</td>
                    </tr>
                `;
            }).join("");

            // Renderização dos botões de paginação no mesmo padrão da home
            let botoesPagina = '';
            for (let i = 0; i < data.totalPages; i++) {
                botoesPagina += `<button onclick="listarHistorico(${i})" class="${i === paginaAtual ? 'ativa' : ''}">${i + 1}</button>`;
            }

            if (containerPaginacao) {
                containerPaginacao.innerHTML = botoesPagina;
            }

        } catch (error) {
            console.error("Erro ao carregar o histórico:", error);

            lista.innerHTML = `
                <tr>
                    <td colspan="4" style="text-align: center; color: #333;">
                        Não foi possível carregar o histórico.
                    </td>
                </tr>
            `;
        }
    }
</script>
</body>
</html>
