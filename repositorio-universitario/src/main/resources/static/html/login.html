<!DOCTYPE html>
<html lang="en">
<head>
    <!--Oi gente, eu segui um tutorial para criar um botão de fazer login com o Google, para não dar erro de acesso negado o link do arquivo deve estar em localhost
     (ex: localhost:5500/login.html) pelo menos assim funcionou para mim. O endereço do Live Server no Visual Studio Code (VS Code) é http://127.0.0.1:5500. Isso é só o começo, ainda
     precisamos ver o backend para validar o email, guardar as informações do usuário, redirecionar para a página de um usuário etc -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - Repositório Universitário - BSI UNIRIO</title>
    
    <link rel="stylesheet" href="/css/style.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>
<body id="body-login">
    <div id="conteudo-pagina-login">
        <div id="apresentacao">
            <div id="titulo">
                <h2>Bem vindo(a)!</h2>
            </div>
        </div>
        <div id="login">
            <div id="logo-login">
                <img src="../fotos/bsi-logo.png" alt="Logo do BSI UNIRIO" />
                <h1>
                    <span class="linha1">REPOSITÓRIO</span>
                    <span class="linha2">UNIVERSITÁRIO</span>
                </h1>
            </div>
            <div id="form-login">
                <h2>Login</h2>
                <a href="http://localhost:8080/oauth2/authorization/google">login</a>
                <p>Realize o login utilizando seu e-mail institucional da UNIRIO.</p>
                <p id="espaco">Qualquer outro e-mail usado não será aceito.</p>
                <fieldset><legend>ou</legend></fieldset>
                <div id="link">
                    <a href="html/visitante.html">Continue como visitante</a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
