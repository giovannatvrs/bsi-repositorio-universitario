<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Arquivos - Repositório Universitário - BSI UNIRIO</title>
    <link rel="stylesheet" href="/css/style.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>
<body>

<header>
    <div class="logo">
        <img src="../fotos/cropped-bsi-logomarcaV01.png" alt="Logotipo do curso de BSI da UNIRIO" id="imagem-logo">
        <h1>
            <a href="home.html">
                <span class="linha1">REPOSITÓRIO</span>
                <span class="linha2">UNIVERSITÁRIO</span>
            </a>
        </h1>
    </div>
    <div class="menu-perfil">
        <div class="informacoes-perfil">
            <img src="" id="foto-perfil" alt="Foto de perfil" referrerpolicy="no-referrer">
            <span id="nome-usuario"></span>
            <span class="material-symbols-outlined" id="seta-mais-opcoes">keyboard_arrow_down</span>
        </div>
        <div class="opcoes">
            <div class="logout">
                <span class="material-symbols-outlined">logout</span>
                <a href="/logout">Sair</a>
            </div>
        </div>
    </div>

</header>
<div class="notificacao">

</div>
<div id="container">
    <aside>
        <div id="paginas">

        </div>

    </aside>
    <section id="main">
        <h2>Meus Arquivos</h2>
        <table id="tabela">
            <thead>
            <tr>
                <th>Nome</th>
                <th>Disciplina</th>
                <th>Status</th>
                <th></th>
                <th></th>
                <th></th>
            </tr>
            </thead>
            <tbody id="lista-arquivos-usuario">

            </tbody>
        </table>
        <div id="paginacao-arquivos-usuario" class="paginacao">

        </div>
    </section>
</div>
<script src="js/acoes-usuario.js"></script>
<script src="js/script.js"></script>
</body>
</html>
